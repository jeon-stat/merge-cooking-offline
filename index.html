<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ef765b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Chef's Table — Offline Merge</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar" aria-label="게임 상태">
        <div class="brand"><span aria-hidden="true">👩‍🍳</span><strong>Chef's Table</strong></div>
        <div class="stat coin" title="코인"><span aria-hidden="true">🪙</span><output id="coins">0</output></div>
        <button class="round-button" id="resetButton" type="button" aria-label="진행 초기화">↺</button>
      </header>

      <section class="restaurant-strip" aria-label="레스토랑 진행도">
        <div><span class="eyebrow">첫 번째 식당</span><h1>햇살 가득한 브런치</h1></div>
        <button id="renovateButton" class="renovate-button" type="button">개조 <span id="renovationCost">50</span> 🪙</button>
      </section>

      <section class="orders-panel" aria-labelledby="ordersTitle">
        <div class="section-heading"><h2 id="ordersTitle">손님 주문</h2><span id="orderHint">주문 아이템을 탭해 납품</span></div>
        <div id="orders" class="orders" aria-live="polite"></div>
      </section>

      <section class="board-area" aria-label="병합 보드">
        <div class="board-toolbar">
          <button class="generator generator-fruit" data-generator="fruit" type="button"><span>🍓</span><small>과일 상자</small></button>
          <button class="generator generator-pantry" data-generator="pantry" type="button"><span>🥚</span><small>식료품 상자</small></button>
          <button class="generator generator-kitchen" data-generator="kitchen" type="button"><span>🍳</span><small>조리대</small></button>
          <button id="storageButton" class="storage-button" type="button"><span>🧊</span><small>냉장 보관 <b id="storageCount">0</b>/8</small></button>
        </div>
        <p id="status" class="status" role="status">같은 아이템을 두 번 탭하거나 서로 드래그하면 병합됩니다.</p>
        <div id="board" class="board" aria-label="6 x 7 병합 보드"></div>
      </section>

      <section id="storagePanel" class="storage-panel" hidden aria-label="냉장 보관함">
        <div class="section-heading"><h2>냉장 보관함</h2><button id="closeStorage" type="button">닫기</button></div>
        <p>아이템을 탭하면 비어 있는 보드 칸으로 되돌립니다.</p>
        <div id="storage" class="storage-grid"></div>
      </section>
    </main>
    <template id="itemTemplate">
      <button class="tile" type="button"><span class="item-art"></span><span class="item-name"></span></button>
    </template>
    <script src="game-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
