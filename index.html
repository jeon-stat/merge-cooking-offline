<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e96e53" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>Merge Cooking Offline</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar" aria-label="게임 상태">
        <div class="profile"><span class="portrait" aria-hidden="true">👩🏻‍🍳</span><output id="level">2</output></div>
        <div class="resource energy" aria-label="무한 에너지"><span aria-hidden="true">⚡</span><output>∞</output></div>
        <div class="resource coin" aria-label="코인"><span aria-hidden="true">🪙</span><output id="coins">8</output></div>
        <div class="resource gem" aria-label="보석"><span aria-hidden="true">💎</span><output id="gems">100</output></div>
        <button class="round-button" id="resetButton" type="button" aria-label="오프라인 진행 초기화">↺</button>
      </header>

      <section class="stage-strip" aria-label="현재 레스토랑">
        <div><span class="eyebrow">STAGE 01</span><h1>과일 주스 바</h1><p>Lea의 첫 번째 레스토랑</p></div>
        <div class="stage-art" aria-hidden="true">🍹</div>
      </section>

      <section class="orders-panel" aria-labelledby="ordersTitle">
        <div class="section-heading"><h2 id="ordersTitle">주문</h2><span id="orderHint">완성된 아이템을 탭해 납품</span></div>
        <div id="orders" class="orders" aria-live="polite"></div>
      </section>

      <section class="board-area" aria-label="병합 보드">
        <p id="status" class="status" role="status">같은 재료를 탭해 병합하세요.</p>
        <div id="board" class="board" aria-label="6 x 8 병합 보드"></div>
        <div class="board-actions">
          <button id="storageButton" class="storage-button" type="button"><span aria-hidden="true">🧺</span> 보관함 <b id="storageCount">0</b>/8</button>
          <span>생성기는 쿨다운·에너지 제한 없이 사용할 수 있습니다.</span>
        </div>
      </section>

      <section id="storagePanel" class="storage-panel" hidden aria-label="보관함">
        <div class="section-heading"><h2>보관함</h2><button id="closeStorage" type="button">닫기</button></div>
        <p>아이템을 탭하면 빈 보드 칸으로 되돌립니다.</p>
        <div id="storage" class="storage-grid"></div>
      </section>
    </main>
    <template id="itemTemplate"><button class="tile" type="button"></button></template>
    <script src="game-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
