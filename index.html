<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e96e53" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=58" />
    <title>Merge Cooking Offline</title>
  </head>
  <body>
    <main class="game-shell">
      <div class="restaurant-scene" aria-hidden="true">
        <span class="scene-awning"></span><span class="scene-window"></span><span class="scene-counter"></span>
      </div>
      <header class="topbar" aria-label="게임 상태">
        <div class="profile"><output id="level">35</output></div>
        <div class="resource energy" aria-label="무한 에너지"><span aria-hidden="true">⚡</span><output>∞</output></div>
        <div class="resource coin" aria-label="코인"><span aria-hidden="true">🪙</span><output id="coins">101</output></div>
        <div class="resource gem" aria-label="보석"><span aria-hidden="true">💎</span><output id="gems">20</output></div>
        <button class="shop-button" type="button" aria-label="상점">🏪</button>
      </header>

      <section class="orders-panel" aria-labelledby="ordersTitle">
        <div class="section-heading"><h2 id="ordersTitle">주문</h2><span id="orderHint">완성 아이템을 탭해 납품하세요</span></div>
        <div id="orders" class="orders" aria-live="polite"></div>
      </section>

      <section class="board-area" aria-label="병합 보드">
        <p id="status" class="status" role="status">같은 재료를 탭해 병합하세요.</p>
        <div id="board" class="board" aria-label="7 x 9 병합 보드"></div>
        <div class="board-actions">
          <button id="storageButton" class="storage-button" type="button"><span aria-hidden="true">🧺</span> 보관함 <b id="storageCount">0</b>/8</button>
          <span>생성기는 쿨다운·에너지 제한 없이 사용할 수 있습니다.</span>
        </div>
      </section>

      <section id="storagePanel" class="storage-panel" hidden aria-label="보관함">
        <div class="section-heading"><h2>보관함</h2><button id="closeStorage" type="button">닫기</button></div>
        <p>아이템을 탭하면 빈 보드 칸으로 되돌립니다.</p>
        <div id="storage" class="storage-grid"></div>
      </section>
      <section id="journalPanel" class="journal-panel" hidden aria-label="주문 노트">
        <div class="section-heading"><h2>주문 노트</h2><div class="journal-actions"><button id="openCatalog" type="button">도감</button><button id="closeJournal" type="button">닫기</button></div></div>
        <div class="journal-current-stage" aria-label="현재 레스토랑 진행도">
          <div><strong id="stageName">Fruity Juice Bar</strong><span id="stageCountry">미국</span></div>
          <div class="stage-actions"><span class="stage-stars">개조 <b id="stageStars">0/20</b></span><button id="renovateButton" type="button">개조 50 🪙</button></div>
        </div>
        <p id="journalSummary">현재 식당의 진행 기록</p>
        <p id="journalStageUnlocks" class="journal-stage-unlocks"></p>
        <p id="journalUnlocks" class="journal-unlocks"></p>
        <div id="journalStages" class="journal-stages"></div>
      </section>
      <section id="catalogPanel" class="catalog-panel" hidden aria-label="재료 레시피 도감">
        <div class="section-heading"><h2>재료·레시피 도감</h2><button id="closeCatalog" type="button">닫기</button></div>
        <div class="catalog-tabs"><button id="catalogChains" class="active" type="button">재료 체인</button><button id="catalogRecipes" type="button">레시피</button></div>
        <div id="catalogContent" class="catalog-content"></div>
      </section>
      <nav class="bottom-dock" aria-label="게임 메뉴">
        <button id="journalButton" class="quest-button" type="button" aria-label="주문 노트">🧰<b id="journalCount">0/35</b></button>
        <button id="resetButton" class="home-button" type="button" aria-label="오프라인 진행 초기화">🏠<i>!</i></button>
      </nav>
    </main>
    <template id="itemTemplate"><button class="tile" type="button"></button></template>
  <script src="game-data.js?v=58"></script>
  <script src="app.js?v=58"></script>
  </body>
</html>
